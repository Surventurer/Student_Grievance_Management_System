name: Deploy to Production VPS

on:
  push:
    branches:
      - main
      - beta
      - 'release/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy App on Self-Hosted Runner
    runs-on: self-hosted
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false # Prevents git clean from removing untracked server files (like .env)

      - name: Verify Environment File (.env)
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -f .env ]; then
            echo "✓ .env file already exists in workspace."
            exit 0
          fi

          if [ -n "$PROD_ENV" ]; then
            echo "Creating .env from GitHub Secret PROD_ENV..."
            printf '%s\n' "$PROD_ENV" > .env
            exit 0
          fi

          for env_path in "$HOME/.env" "$HOME/actions-runner/.env" "../.env" "../../.env" "../../../.env" ".env.proud" ".env.prod"; do
            if [ -f "$env_path" ]; then
              echo "Found env file at $env_path, copying to .env..."
              cp "$env_path" .env
              exit 0
            fi
          done

          echo "::error ::No .env file found!"
          echo "------------------------------------------------------------------------"
          echo "Docker Compose requires a .env file containing your production settings."
          echo "To fix this, log into your VPS and run:"
          echo "  nano /home/github/.env"
          echo "(Paste your environment variables there and save)"
          echo "------------------------------------------------------------------------"
          exit 1

      - name: Deploy with Docker Compose
        run: |
          # Ensure full standard PATH is available in non-interactive runner shells
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin:$HOME/.local/bin:$PATH"

          # Detect compose binary
          DOCKER_COMPOSE=""
          if docker compose version >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            DOCKER_COMPOSE="docker-compose"
          elif [ -x /usr/local/bin/docker-compose ]; then
            DOCKER_COMPOSE="/usr/local/bin/docker-compose"
          elif [ -x /usr/bin/docker-compose ]; then
            DOCKER_COMPOSE="/usr/bin/docker-compose"
          elif [ -x /snap/bin/docker-compose ]; then
            DOCKER_COMPOSE="/snap/bin/docker-compose"
          fi

          if [ -z "$DOCKER_COMPOSE" ]; then
            echo "::error ::Neither 'docker compose' nor 'docker-compose' was found on this runner server!"
            echo "------------------------------------------------------------------------"
            echo "To fix this, log into your server and run:"
            echo "  sudo apt-get update && sudo apt-get install -y docker-compose-plugin"
            echo "  sudo usermod -aG docker \$USER"
            echo "------------------------------------------------------------------------"
            exit 1
          fi

          echo "Using compose command: $DOCKER_COMPOSE"

          # Build and launch containers
          $DOCKER_COMPOSE build
          $DOCKER_COMPOSE up -d --remove-orphans

          # Cleanup dangling images to keep server storage clean
          docker image prune -f

      - name: Show Running Containers
        run: |
          docker ps --filter "name=sgs_"

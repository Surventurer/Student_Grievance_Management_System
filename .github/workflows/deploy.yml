name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy App on Self-Hosted Runner
    runs-on: self-hosted
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false # Prevents git clean from removing untracked server files (like .env)

      - name: Verify Environment File (.env)
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -f .env ]; then
            echo "✓ .env file already exists in workspace."
            exit 0
          fi

          if [ -n "$PROD_ENV" ]; then
            echo "Creating .env from GitHub Secret PROD_ENV..."
            printf '%s\n' "$PROD_ENV" > .env
            exit 0
          fi

          for env_path in "$HOME/.env" "$HOME/actions-runner/.env" "../.env" "../../.env" "../../../.env" ".env.proud" ".env.prod"; do
            if [ -f "$env_path" ]; then
              echo "Found env file at $env_path, copying to .env..."
              cp "$env_path" .env
              exit 0
            fi
          done

          echo "::error ::No .env file found!"
          echo "------------------------------------------------------------------------"
          echo "Docker Compose requires a .env file containing your production settings."
          echo "To fix this, log into your VPS and run:"
          echo "  nano /home/github/.env"
          echo "(Paste your environment variables there and save)"
          echo "------------------------------------------------------------------------"
          exit 1

      - name: Deploy with Docker Compose
        run: |
          # Ensure full standard PATH is available in non-interactive runner shells
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin:$HOME/.local/bin:$PATH"

          # If Docker Compose v2 is not installed, install it in user's docker plugins
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose v2 not found. Installing latest Docker Compose v2 into ~/.docker/cli-plugins/..."
            mkdir -p "$HOME/.docker/cli-plugins"
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64) COMPOSE_ARCH="x86_64" ;;
              aarch64|arm64) COMPOSE_ARCH="aarch64" ;;
              *) COMPOSE_ARCH="$ARCH" ;;
            esac
            curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${COMPOSE_ARCH}" -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi

          echo "Using: $(docker compose version)"


<!DOCTYPE html>
<html>
<head>
    <title>Bulk Delete Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .button:disabled { background: #ccc; cursor: not-allowed; }
        .checkbox { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Bulk Delete Debug Test</h1>
    
    <div class="debug">
        <h3>Step 1: Check if CSRF token exists</h3>
        <input type="hidden" name="csrfmiddlewaretoken" value="test-csrf-token">
        <button onclick="checkCSRF()">Check CSRF Token</button>
        <div id="csrfResult"></div>
    </div>
    
    <div class="debug">
        <h3>Step 2: Test checkbox selection</h3>
        <div class="checkbox">
            <input type="checkbox" class="user-checkbox" name="user_select" value="1"> User 1
        </div>
        <div class="checkbox">
            <input type="checkbox" class="user-checkbox" name="user_select" value="2"> User 2
        </div>
        <div class="checkbox">
            <input type="checkbox" class="user-checkbox" name="user_select" value="3"> User 3
        </div>
        <button onclick="checkSelected()">Check Selected</button>
        <div id="selectionResult"></div>
    </div>
    
    <div class="debug">
        <h3>Step 3: Test bulk delete button</h3>
        <button class="button" onclick="testBulkDelete()" id="testDeleteBtn">Test Bulk Delete</button>
        <div id="deleteResult"></div>
    </div>
    
    <script>
        function checkCSRF() {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
            const result = document.getElementById('csrfResult');
            if (csrfToken) {
                result.innerHTML = `✅ CSRF token found: ${csrfToken.value}`;
                result.style.color = 'green';
            } else {
                result.innerHTML = '❌ CSRF token NOT found';
                result.style.color = 'red';
            }
        }
        
        function checkSelected() {
            const checkboxes = document.querySelectorAll('.user-checkbox:checked');
            const result = document.getElementById('selectionResult');
            const userIds = Array.from(checkboxes).map(cb => cb.value);
            result.innerHTML = `Selected ${checkboxes.length} users: ${userIds.join(', ')}`;
        }
        
        function testBulkDelete() {
            const result = document.getElementById('deleteResult');
            result.innerHTML = 'Testing...';
            
            const checkboxes = document.querySelectorAll('.user-checkbox:checked');
            if (checkboxes.length === 0) {
                result.innerHTML = '❌ No users selected';
                result.style.color = 'red';
                return;
            }
            
            const userIds = Array.from(checkboxes).map(cb => cb.value);
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
            
            if (!csrfToken) {
                result.innerHTML = '❌ CSRF token not found';
                result.style.color = 'red';
                return;
            }
            
            result.innerHTML = `✅ Would delete users: ${userIds.join(', ')}<br>CSRF: ${csrfToken.value}`;
            result.style.color = 'green';
        }
        
        // Add event listeners
        document.querySelectorAll('.user-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const selectedCount = document.querySelectorAll('.user-checkbox:checked').length;
                console.log('Selected count:', selectedCount);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dropdown Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        select { padding: 8px; margin: 10px; width: 200px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Simple School-Department Test</h1>
    
    <div>
        <label>School:</label>
        <select id="school">
            <option value="">Select School</option>
            <option value="10">School of Engineering</option>
            <option value="11">School of Business</option>
            <option value="12">School of Arts and Sciences</option>
            <option value="13">School of Medicine</option>
        </select>
    </div>
    
    <div>
        <label>Department:</label>
        <select id="department">
            <option value="">Select Department</option>
        </select>
    </div>
    
    <div class="debug" id="debug">
        <strong>Debug Info:</strong><br>
        <div id="debug-log"></div>
    </div>
    
    <script>
        function log(message) {
            const debugLog = document.getElementById('debug-log');
            const entry = document.createElement('div');
            entry.textContent = new Date().toLocaleTimeString() + ': ' + message;
            debugLog.appendChild(entry);
            console.log(message);
        }
        
        window.addEventListener('load', function() {
            log('Page loaded, setting up dropdown');
            
            const schoolSelect = document.getElementById('school');
            const departmentSelect = document.getElementById('department');
            
            if (!schoolSelect || !departmentSelect) {
                log('ERROR: Could not find dropdown elements');
                return;
            }
            
            log('Found dropdown elements');
            
            schoolSelect.addEventListener('change', function() {
                const schoolId = this.value;
                log('School changed to: ' + schoolId);
                
                // Clear departments
                departmentSelect.innerHTML = '<option value="">Select Department</option>';
                
                if (!schoolId) {
                    log('No school selected');
                    return;
                }
                
                // Fetch departments
                const url = '/auth/load-departments/?school_id=' + schoolId;
                log('Fetching from: ' + url);
                
                fetch(url)
                    .then(function(response) {
                        log('Response status: ' + response.status);
                        return response.json();
                    })
                    .then(function(data) {
                        log('Received ' + data.departments.length + ' departments');
                        
                        data.departments.forEach(function(dept) {
                            const option = document.createElement('option');
                            option.value = dept.id;
                            option.textContent = dept.name;
                            departmentSelect.appendChild(option);
                        });
                        
                        log('All departments added');
                    })
                    .catch(function(error) {
                        log('ERROR: ' + error);
                    });
            });
            
            log('Event listener attached');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Test Student Profile API</h1>
    <button onclick="testAPI()">Test Student ID 27</button>
    <pre id="result"></pre>

    <script>
        function testAPI() {
            fetch('/admin-panel/superadmin/users/27/details/', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                document.getElementById('result').textContent = 'Error: ' + error;
            });
        }
    </script>
</body>
</html>

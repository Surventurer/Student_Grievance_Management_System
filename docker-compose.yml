version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src/media:/app/media
      - ./logs:/app/logs
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      - redis
    
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    
  celery:
    build: .
    command: uv run celery -A config worker --loglevel=info
    volumes:
      - ./src/media:/app/media
      - ./logs:/app/logs
    depends_on:
      - redis
    environment:
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0

  celery-beat:
    build: .
    command: uv run celery -A config beat --loglevel=info
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    environment:
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0
